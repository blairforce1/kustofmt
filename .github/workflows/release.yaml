# Releases happen two ways, and both end in the same job.
#
#   push a v* tag   a deliberate release; this is how the historical replay of
#                   kustomize 5.6.0 -> 5.8.1 was cut
#   merge to main   the version at the matrix head has no tag yet, so this
#                   creates the tag and releases in the same run
#
# The second path tags and releases in ONE job on purpose. A tag pushed with
# GITHUB_TOKEN does not trigger a `push: tags` workflow -- GitHub suppresses it
# to prevent recursion -- so splitting the work across two workflows would need
# a stored personal access token. Doing both here needs no secret at all.
#
# Everything published is reproducible: -trimpath, a commit-pinned build
# timestamp, and keyless signatures tied to this workflow's OIDC identity.
name: Release
on:
  push:
    branches:
    - main
    tags:
    - v*
permissions:
  contents: read
# Releases must not overlap: they race on the `latest` container tag, and the
# replay pushes several tags at once. Queue them rather than cancel.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      # Narrowed to exactly what each capability needs.
      contents: write # create the release and, on a main push, the tag
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing via OIDC
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # GoReleaser needs full history and tags to compute the version.
        fetch-depth: 0
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    # On a tag push the version is the tag. On a merge to main it is the matrix
    # head, and there is nothing to do if that version is already out -- which is
    # every ordinary commit, so this job is usually a fast no-op.
    - name: Decide whether to release
      id: target
      run: |
        git fetch --tags --force
        if [ "$GITHUB_REF_TYPE" = tag ]; then
          version="$GITHUB_REF_NAME"
          echo "tag push: releasing $version"
        else
          version="v$(go run ./cmd/compat version)"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "main is at $version and that tag exists; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "main is at $version and it is untagged: releasing"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "release=true" >> "$GITHUB_OUTPUT"
    # Refuse to publish something that does not pass its own gate.
    - name: Pre-release checks
      if: steps.target.outputs.release == 'true'
      run: make release-check FUZZTIME=60s
    # Created here rather than in a separate workflow; see the note at the top
    # about GITHUB_TOKEN not triggering `push: tags`.
    - name: Tag this commit
      if: steps.target.outputs.release == 'true' && github.ref_type != 'tag'
      env:
        VERSION: ${{ steps.target.outputs.version }}
      run: |
        git config user.name 'blairforce1'
        git config user.email 'git@blairforce1.com'
        git tag -a "$VERSION" -m "kustofmt $VERSION"
        git push origin "$VERSION"
    # Pinning the action is not enough when the action installs a tool: the tool
    # version has to be pinned too, or an action bump silently changes it.
    # cosign v3 deprecated --output-certificate and --output-signature, which
    # .goreleaser.yaml passes -- under v3 they are ignored and NO signature files
    # are written, so a release would publish unsigned without failing. These are
    # the versions that produced v0.1.0 through v0.1.4.
    - if: steps.target.outputs.release == 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v2.5.2
    - if: steps.target.outputs.release == 'true'
      uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      with:
        syft-version: v1.42.3
    - if: steps.target.outputs.release == 'true'
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
    - if: steps.target.outputs.release == 'true'
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - if: steps.target.outputs.release == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # The style contract is kyaml's emission, so the release records which kyaml
    # defined it.
    - name: Resolve kyaml version
      if: steps.target.outputs.release == 'true'
      run: echo "KYAML_VERSION=$(./scripts/kyaml-version.sh)" >> "$GITHUB_ENV"
    - name: Extract release notes for this version
      if: steps.target.outputs.release == 'true'
      env:
        VERSION: ${{ steps.target.outputs.version }}
      run: |
        version="${VERSION#v}"
        awk -v v="$version" '
          $0 ~ "^## \\[" v "\\]" {found=1; next}
          found && /^## \[/ {exit}
          found {print}
        ' CHANGELOG.md > /tmp/release-notes.md
        if [ ! -s /tmp/release-notes.md ]; then
          echo "::error::CHANGELOG.md has no section for $VERSION"
          exit 1
        fi
        cat /tmp/release-notes.md
    - if: steps.target.outputs.release == 'true'
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: v2.17.1
        args: release --clean --release-notes=/tmp/release-notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        KYAML_VERSION: ${{ env.KYAML_VERSION }}
    # README.md tells people to run this. A release that cannot pass it has
    # published instructions that do not work, so the job fails rather than
    # finishing quietly -- the artifacts are already out by this point, and a
    # red release is how anyone finds out in time to do something about it.
    #
    # The second call points Rekor at a dead port. That is the property the
    # bundle exists for: the detached pair this replaced had to search the
    # transparency log, and could not be verified without reaching it.
    - name: Verify the signature just published
      if: steps.target.outputs.release == 'true'
      working-directory: dist
      run: |
        verify() {
          cosign verify-blob --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp 'https://github.com/blairforce1/kustofmt/.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$@" checksums.txt
        }
        verify
        verify --rekor-url http://127.0.0.1:1
