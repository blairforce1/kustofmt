# Releases are cut by pushing a v* tag. Everything the workflow publishes is
# reproducible: -trimpath, a commit-pinned build timestamp, and keyless
# signatures tied to this workflow's OIDC identity.
name: Release
on:
  push:
    tags:
    - 'v*'
permissions:
  contents: read
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      # Narrowed to exactly what each capability needs.
      contents: write # create the GitHub release
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing via OIDC
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        # GoReleaser needs full history and tags to compute the version.
        fetch-depth: 0
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: go.mod
    # Refuse to publish something that does not pass its own gate.
    - name: Pre-release checks
      run: make release-check FUZZTIME=60s
    - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
    - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
    - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # The style contract is kyaml's emission, so the release records which
    # kyaml defined it.
    - name: Resolve kyaml version
      run: echo "KYAML_VERSION=$(./scripts/kyaml-version.sh)" >> "$GITHUB_ENV"
    - name: Extract release notes for this tag
      run: |
        version="${GITHUB_REF_NAME#v}"
        awk -v v="$version" '
          $0 ~ "^## \\[" v "\\]" {found=1; next}
          found && /^## \[/ {exit}
          found {print}
        ' CHANGELOG.md > /tmp/release-notes.md
        if [ ! -s /tmp/release-notes.md ]; then
          echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
          exit 1
        fi
        cat /tmp/release-notes.md
    - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
      with:
        version: '~> v2'
        args: release --clean --release-notes=/tmp/release-notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        KYAML_VERSION: ${{ env.KYAML_VERSION }}
