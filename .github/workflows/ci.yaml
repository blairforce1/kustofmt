# CI is a backstop, not the source of truth: every job below maps to a Makefile
# target that runs identically on a laptop. `make ci` is the whole pipeline.
name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
# The default token is far more powerful than any job here needs.
permissions:
  contents: read
# Superseded runs on the same ref are pointless; cancelling keeps the badge
# honest about the current state rather than a stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # go.mod is the single source of truth for the toolchain version.
        go-version-file: go.mod
    - name: gofmt
      run: make fmt-check
    - name: go vet
      run: make vet
    - name: modules tidy
      run: make tidy-check
    - name: shellcheck
      # Through make, so CI uses the same pinned image a laptop does. The
      # runner ships its own shellcheck, and letting that decide what is clean
      # is how a lint failure first appears after a tag is already cut.
      run: make shellcheck
    - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.13.1
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Test with race detector and coverage
      # bash on every platform, including Windows. PowerShell mangles the
      # -coverprofile=cover.out argument, splitting it so that `.out` arrives as
      # a package path and the run fails with "no required module provides
      # package .out" before a single test executes.
      shell: bash
      run: go test -race -covermode=atomic -coverprofile=cover.out ./...
    # The whole of the coverage reporting. It was previously also uploaded to a
    # third-party service, which silently rejected every upload for want of a
    # token that was never set -- a green tick over a failed request, for the
    # life of the repository. The run's own summary page needs no account, no
    # secret and no uptime but GitHub's.
    - name: Coverage summary
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: go tool cover -func=cover.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - goos: linux
          goarch: amd64
        - goos: linux
          goarch: arm64
        - goos: darwin
          goarch: amd64
        - goos: darwin
          goarch: arm64
        - goos: windows
          goarch: amd64
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
      env:
        CGO_ENABLED: "0"
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/kustofmt
  selfhost:
    name: Self-hosting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    # The formatter's own repository must pass its own formatter, including
    # these workflow files.
    - name: kustofmt -l over this repository
      run: make selfhost
  compat:
    name: Compatibility matrix
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    # Its own job because it reaches the network: it re-derives every row from
    # upstream's go.mod rather than trusting compatibility.yaml. Kept out of the
    # lint job so an upstream blip cannot masquerade as a lint failure.
    - name: Re-derive the matrix from upstream
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: make compat-check-complete
  signing:
    name: Signing
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    # release.yaml holds the pin; this job reads it rather than repeating it. A
    # second copy could drift, and the drift would show up as a skipped test
    # rather than a failure -- the quietest possible way to lose a check.
    - name: Read the cosign version the release pins
      id: cosign
      run: echo "version=$(make -s cosign-version)" >> "$GITHUB_OUTPUT"
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: ${{ steps.cosign.outputs.version }}
    # The only job that executes anything from the release pipeline. Nothing
    # else here runs release.yaml, which is how a signing config that produces
    # no signature stayed invisible until a tag was already cut.
    - name: Run the release's own cosign arguments
      run: make sign-check
  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    # A short run on every PR. The long run is `make release-check` before a
    # tag; this is here to catch a regression that the seed corpus misses.
    - name: Fuzz for 20s per target
      run: make fuzz FUZZTIME=20s
