# The keyless half of the signing check, which CI cannot run.
#
# Signing with a GitHub OIDC identity needs `id-token: write`, and the CI
# workflow deliberately does not have it, so the pull request lane can only
# exercise the signing arguments against a throwaway key. That catches a config
# whose arguments write nothing, but says nothing about Fulcio, Rekor, or the
# verification command the README publishes. This job covers the rest.
#
# Dispatch only, never on a schedule or a push: keyless signing writes a
# permanent entry to Sigstore's public-good transparency log. A handful of
# deliberate runs before a signing change merges is fine; one per pull request
# would be an imposition on a shared service for no added signal.
name: Signing smoke
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  keyless:
    name: Keyless sign and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the entire point: a real identity to sign as
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Read the cosign version the release pins
      id: cosign
      run: echo "version=$(make -s cosign-version)" >> "$GITHUB_OUTPUT"
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: ${{ steps.cosign.outputs.version }}
    # Signs exactly as a release signs -- same arguments, read from
    # .goreleaser.yaml -- then verifies with the command README.md publishes,
    # read from the file rather than restated, and again with Rekor pointed at a
    # dead port to prove the bundle needs no transparency-log lookup.
    - name: Sign keylessly, then verify the way the README says to
      env:
        KUSTOFMT_SIGN_KEYLESS: "1"
        KUSTOFMT_SIGN_OUTDIR: ${{ runner.temp }}/signing-smoke
      run: go test ./internal/release/ -run TestKeyless -v
    # A forward-compatibility probe, deliberately unpinned: can a newer cosign
    # than the one that signed still verify the result? The step above is the
    # authority on the release; this one is early warning for the day the pin
    # moves. The command is spelled out because this runs after the Go test has
    # finished with the directory.
    - name: Check a newer cosign still verifies it
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - name: Verify with the newer cosign
      working-directory: ${{ runner.temp }}/signing-smoke
      run: |
        cosign version
        cosign verify-blob --bundle checksums.txt.sigstore.json \
          --certificate-identity-regexp 'https://github.com/blairforce1/kustofmt/.*' \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          checksums.txt
