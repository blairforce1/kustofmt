# kyaml is deliberately excluded below. Its version is not a dependency choice:
# it is the library whose emitter defines kustofmt's output style, chosen to
# match a specific kustomize release and recorded in compatibility.yaml. The
# kustomize-watch workflow owns it. A Dependabot bump would put go.mod out of
# step with the matrix, which the compatibility gate would reject -- producing a
# pull request that can never pass, every week, forever.
version: 2
updates:
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
  commit-message:
    prefix: deps
  ignore:
  - dependency-name: sigs.k8s.io/kustomize/kyaml
  groups:
    go-dependencies:
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  commit-message:
    prefix: ci
  groups:
    actions:
      patterns:
      - '*'
